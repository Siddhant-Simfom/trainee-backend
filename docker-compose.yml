version: "3.9"

services:

  trainee-mysql:
    image: mysql:8.0
    container_name: trainee-mysql
    restart: always
    networks:
      - app-net
    volumes:
      - mysql_data:/var/lib/mysql
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./trainee-backend/
    image: backend-image
    container_name: backend
    ports:
      - "5000:5000"
    env_file:
      - .env
    networks:
      - app-net
    environment:
      DB_HOST: trainee-mysql  
      DB_USER: trainee_user
      DB_PASSWORD: trainee_pass
      DB_NAME: trainee_db
    depends_on:
      trainee-mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./trainee-frontend/
    image: frontend-image
    container_name: frontend
    networks:
      - app-net
    depends_on:
      - backend

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - frontend
      - backend
    networks:
      - app-net

  prometheus:
    image: prom/prometheus:latest  
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - monitoring
      - app-net  
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest   
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana   
    networks:
      - monitoring
    restart: unless-stopped

networks:
  monitoring:
    driver: bridge
  app-net:
    driver: bridge

volumes:
  mysql_data:
  prometheus_data:
  grafana_data: